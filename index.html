<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ㄴㄴㅂ 전투 계산기</title>

  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --panel-soft: #f9fafb;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #111827;
      --accent-soft: #eef1f5;
      --shadow: 0 14px 40px rgba(17, 24, 39, 0.08);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Pretendard",
        "Noto Sans KR",
        "Segoe UI",
        sans-serif;
    }

    .wrap {
      width: min(1040px, calc(100% - 28px));
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    header {
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 34px);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .characters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: white;
      font-weight: 800;
    }

    .name-input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }

    .card-body {
      padding: 18px 20px 20px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin: 4px 0 10px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: 12px;
      padding: 11px 12px;
      outline: none;
      font-size: 16px;
      color: var(--text);
    }

    .suffix {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
    }

    .resist-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .resist-grid label {
      text-align: center;
    }

    .resist-grid input {
      text-align: center;
      padding-inline: 7px;
    }

    .controls {
      margin-top: 18px;
      padding: 20px;
    }

    .control-block + .control-block {
      margin-top: 18px;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 6px;
      background: var(--accent-soft);
      border-radius: 15px;
    }

    .segmented.four {
      grid-template-columns: repeat(4, 1fr);
    }

    .segmented input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .segmented label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border-radius: 10px;
      padding: 11px 8px;
      cursor: pointer;
      user-select: none;
      transition: 0.15s ease;
    }

    .segmented input[type="radio"]:checked + label {
      background: white;
      color: var(--text);
      box-shadow: 0 2px 10px rgba(17, 24, 39, 0.08);
    }

    .calculate {
      width: 100%;
      margin-top: 20px;
      border: 0;
      border-radius: 14px;
      padding: 15px 18px;
      background: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .result {
      margin-top: 18px;
      padding: 28px 22px;
      text-align: center;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .result-item + .result-item {
      border-left: 1px solid var(--line);
    }

    .result-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .result-value {
      font-size: clamp(34px, 7vw, 54px);
      font-weight: 900;
      line-height: 1;
    }

    .outcome {
      margin-top: 14px;
      padding: 18px 20px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      font-size: 20px;
      font-weight: 900;
    }

    .outcome.success {
      color: #166534;
      border-color: #bbf7d0;
      background: #f0fdf4;
    }

    .outcome.fail {
      color: #991b1b;
      border-color: #fecaca;
      background: #fef2f2;
    }

    .error {
      margin-top: 12px;
      min-height: 18px;
      text-align: center;
      color: #b42318;
      font-size: 13px;
      font-weight: 700;
    }

    .tiny {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .characters {
        grid-template-columns: 1fr;
      }

      .resist-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .segmented.four {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 430px) {
      .field-grid {
        grid-template-columns: 1fr;
      }

      .result {
        grid-template-columns: 1fr;
      }

      .result-item + .result-item {
        border-left: 0;
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <header>
      <h1>ㄴㄴㅂ 전투 계산기</h1>
      <div class="subtitle">
        수치 입력 → 공격 방향/속성 선택 → 공격 판정
      </div>
    </header>

    <section class="characters">

      <!-- A -->
      <article class="card">
        <div class="card-head">
          <div class="badge">A</div>
          <input
            class="name-input"
            id="nameA"
            type="text"
            value="A"
          />
        </div>

        <div class="card-body">

          <div class="section-title">전투 수치</div>

          <div class="field-grid">

            <div class="field">
              <label>레벨</label>
              <input id="levelA" type="number" value="1" min="0" />
            </div>

            <div class="field">
              <label>무기 피해</label>
              <input id="weaponA" type="number" value="0" />
            </div>

            <div class="field">
              <label>성공률</label>

              <div class="input-wrap">
                <input
                  id="successA"
                  type="number"
                  min="0"
                  max="100"
                  placeholder="100"
                />

                <span class="suffix">%</span>
              </div>
            </div>

            <div class="field">
              <label>방어력</label>
              <input id="defenseA" type="number" value="0" min="0" />
            </div>

          </div>

          <div class="section-title" style="margin-top:18px;">
            내성 계수
          </div>

          <div class="resist-grid">

            <div class="field">
              <label>병기</label>
              <input id="weaponResA" type="number" step="0.1" value="1.0" />
            </div>

            <div class="field">
              <label>화기</label>
              <input id="fireResA" type="number" step="0.1" value="1.0" />
            </div>

            <div class="field">
              <label>마법</label>
              <input id="magicResA" type="number" step="0.1" value="1.0" />
            </div>

            <div class="field">
              <label>신성</label>
              <input id="holyResA" type="number" step="0.1" value="1.0" />
            </div>

          </div>

        </div>
      </article>


      <!-- B -->
      <article class="card">

        <div class="card-head">
          <div class="badge">B</div>

          <input
            class="name-input"
            id="nameB"
            type="text"
            value="B"
          />
        </div>

        <div class="card-body">

          <div class="section-title">전투 수치</div>

          <div class="field-grid">

            <div class="field">
              <label>레벨</label>
              <input id="levelB" type="number" value="1" min="0" />
            </div>

            <div class="field">
              <label>무기 피해</label>
              <input id="weaponB" type="number" value="0" />
            </div>

            <div class="field">
              <label>성공률</label>

              <div class="input-wrap">
                <input
                  id="successB"
                  type="number"
                  min="0"
                  max="100"
                  placeholder="100"
                />

                <span class="suffix">%</span>
              </div>
            </div>

            <div class="field">
              <label>방어력</label>
              <input id="defenseB" type="number" value="0" min="0" />
            </div>

          </div>


          <div class="section-title" style="margin-top:18px;">
            내성 계수
          </div>

          <div class="resist-grid">

            <div class="field">
              <label>병기</label>
              <input id="weaponResB" type="number" step="0.1" value="1.0" />
            </div>

            <div class="field">
              <label>화기</label>
              <input id="fireResB" type="number" step="0.1" value="1.0" />
            </div>

            <div class="field">
              <label>마법</label>
              <input id="magicResB" type="number" step="0.1" value="1.0" />
            </div>

            <div class="field">
              <label>신성</label>
              <input id="holyResB" type="number" step="0.1" value="1.0" />
            </div>

          </div>

        </div>
      </article>

    </section>


    <!-- 공격 설정 -->
    <section class="card controls">

      <div class="control-block">

        <div class="section-title">
          공격 방향
        </div>

        <div class="segmented">

          <input
            type="radio"
            name="direction"
            id="dirAtoB"
            value="AtoB"
            checked
          />

          <label for="dirAtoB">
            <span id="dirAtoBText">
              A → B
            </span>
          </label>


          <input
            type="radio"
            name="direction"
            id="dirBtoA"
            value="BtoA"
          />

          <label for="dirBtoA">
            <span id="dirBtoAText">
              B → A
            </span>
          </label>

        </div>

      </div>


      <div class="control-block">

        <div class="section-title">
          공격 속성
        </div>

        <div class="segmented four">

          <input
            type="radio"
            name="attackType"
            id="typeWeapon"
            value="weapon"
            checked
          />

          <label for="typeWeapon">
            병기
          </label>


          <input
            type="radio"
            name="attackType"
            id="typeFire"
            value="fire"
          />

          <label for="typeFire">
            화기
          </label>


          <input
            type="radio"
            name="attackType"
            id="typeMagic"
            value="magic"
          />

          <label for="typeMagic">
            마법
          </label>


          <input
            type="radio"
            name="attackType"
            id="typeHoly"
            value="holy"
          />

          <label for="typeHoly">
            신성
          </label>

        </div>

      </div>


      <button
        class="calculate"
        id="calculateBtn"
      >
        계산하기
      </button>

      <div
        class="error"
        id="errorMsg"
      ></div>

    </section>


    <!-- 결과 -->
    <section class="result">

      <div class="result-item">

        <div class="result-label">
          실제 피해
        </div>

        <div
          class="result-value"
          id="damageResult"
        >
          0
        </div>

      </div>


      <div class="result-item">

        <div class="result-label">
          성공률
        </div>

        <div
          class="result-value"
          id="successResult"
        >
          100%
        </div>

      </div>

    </section>


    <section
      class="outcome"
      id="outcomeResult"
    >
      판정 대기
    </section>


    <div class="tiny">
      기본 피해 = 레벨 × 10
    </div>

  </main>


  <script>

    const damageResult =
      document.getElementById("damageResult");

    const successResult =
      document.getElementById("successResult");

    const outcomeResult =
      document.getElementById("outcomeResult");

    const errorMsg =
      document.getElementById("errorMsg");


    function getValue(id, fallback = 0) {

      const input =
        document.getElementById(id);

      const raw =
        input.value.trim();

      if (raw === "") {
        return fallback;
      }

      return Number(raw);
    }


    function getCharacter(key) {

      return {

        level:
          getValue(`level${key}`),

        weaponDamage:
          getValue(`weapon${key}`),

        success:
          getValue(`success${key}`, 100),

        defense:
          getValue(`defense${key}`),

        resist: {

          weapon:
            getValue(`weaponRes${key}`, 1),

          fire:
            getValue(`fireRes${key}`, 1),

          magic:
            getValue(`magicRes${key}`, 1),

          holy:
            getValue(`holyRes${key}`, 1)

        }

      };

    }


    function formatNumber(number) {

      if (Number.isInteger(number)) {

        return number.toLocaleString("ko-KR");

      }

      return Number(
        number.toFixed(2)
      ).toLocaleString("ko-KR");

    }


    function calculate() {

      errorMsg.textContent = "";


      const A =
        getCharacter("A");

      const B =
        getCharacter("B");


      const direction =
        document.querySelector(
          'input[name="direction"]:checked'
        ).value;


      const attackType =
        document.querySelector(
          'input[name="attackType"]:checked'
        ).value;


      const attacker =
        direction === "AtoB"
          ? A
          : B;


      const defender =
        direction === "AtoB"
          ? B
          : A;


      /*
        기본 피해

        LV 1 = 10
        LV 2 = 20
        LV 3 = 30
        ...
      */

      const basicDamage =
        attacker.level * 10;


      /*
        기본 피해 + 무기 피해
      */

      const rawDamage =
        basicDamage +
        attacker.weaponDamage;


      /*
        방어력 차감

        피해보다 방어력이 높으면
        최소 0
      */

      const afterDefense =
        Math.max(
          0,
          rawDamage -
          defender.defense
        );


      /*
        상대의 해당 속성
        내성 계수
      */

      const resistance =
        defender.resist[
          attackType
        ];


      /*
        공격 성공 시 들어갈 피해
      */

      const successDamage =
        afterDefense *
        resistance;


      /*
        성공률 판정

        예:

        성공률 70
        랜덤값 0~100

        70 미만이면 성공
      */

      const roll =
        Math.random() * 100;


      const succeeded =
        roll <
        attacker.success;


      /*
        성공 = 정상 피해
        실패 = 0 피해
      */

      const actualDamage =
        succeeded
          ? successDamage
          : 0;


      damageResult.textContent =
        formatNumber(
          actualDamage
        );


      successResult.textContent =
        `${formatNumber(
          attacker.success
        )}%`;


      if (succeeded) {

        outcomeResult.textContent =
          "공격 성공";

        outcomeResult.classList.remove(
          "fail"
        );

        outcomeResult.classList.add(
          "success"
        );

      }

      else {

        outcomeResult.textContent =
          "공격 실패";

        outcomeResult.classList.remove(
          "success"
        );

        outcomeResult.classList.add(
          "fail"
        );

      }

    }


    function updateDirectionNames() {

      const nameA =
        document
          .getElementById("nameA")
          .value
          .trim() || "A";


      const nameB =
        document
          .getElementById("nameB")
          .value
          .trim() || "B";


      document
        .getElementById(
          "dirAtoBText"
        )
        .textContent =
          `${nameA} → ${nameB}`;


      document
        .getElementById(
          "dirBtoAText"
        )
        .textContent =
          `${nameB} → ${nameA}`;

    }


    document
      .getElementById("nameA")
      .addEventListener(
        "input",
        updateDirectionNames
      );


    document
      .getElementById("nameB")
      .addEventListener(
        "input",
        updateDirectionNames
      );


    document
      .getElementById(
        "calculateBtn"
      )
      .addEventListener(
        "click",
        calculate
      );


    updateDirectionNames();

  </script>

</body>
</html>
